<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>填词补文 · 120 词闪卡</title>
<meta name="description" content="自考英语（专升本）填词补文高频词闪卡：120 个词，按 5 天计划分组，支持中英互测、错词重刷、发音与进度记录。纯静态页面，可直接部署到 GitHub Pages。">
<meta name="theme-color" content="#f4efe4">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    try {
      var raw = localStorage.getItem("cloze-flashcards-v1");
      var saved = raw ? JSON.parse(raw) : {};
      var theme = (saved.prefs && saved.prefs.theme) ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#131519" : "#f4efe4");
    } catch (e) { /* 隐私模式下忽略 */ }
  })();
</script>
</head>
<body>
<a class="skip" href="#stage">跳到卡片</a>

<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="seal" aria-hidden="true">词</span>
      <div class="brand-text">
        <h1><span class="t-long">填词补文 · 120 词闪卡</span><span class="t-short">填词补文闪卡</span></h1>
        <p>自考英语（专升本）· 5 天冲刺快刷</p>
      </div>
    </div>
    <div class="bar-tools">
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="发音设置" aria-expanded="false" aria-controls="settingsPop" title="发音设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="listBtn" type="button" aria-label="打开词表" title="全部单词">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
    </div>

    <div class="pop-backdrop" id="popBackdrop" hidden></div>
    <div class="pop" id="settingsPop" hidden>
      <div class="pop-head">
        <strong>发音设置</strong>
        <button type="button" class="pop-close" id="popClose" aria-label="关闭设置">×</button>
      </div>
      <label class="pop-row">
        <span>音色</span>
        <select id="voiceSelect" aria-label="选择英文音色"></select>
      </label>
      <label class="pop-row">
        <span>语速</span>
        <select id="speedSelect" aria-label="选择语速"></select>
      </label>
      <label class="pop-check">
        <input type="checkbox" id="autoSpeakCheck">
        <span>显示卡片时自动朗读</span>
      </label>
      <div class="pop-foot">
        <button type="button" class="pop-test" id="voiceTest">试听</button>
        <span>微信 / iOS 首次需点喇叭授权</span>
      </div>
    </div>
  </header>

  <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

  <main id="stage">
    <div class="toolbar">
      <div class="seg" id="daySeg" role="group" aria-label="按天分组">
        <button type="button" data-day="all" class="is-on">全部</button>
        <button type="button" data-day="1">第 1 天</button>
        <button type="button" data-day="2">第 2 天</button>
        <button type="button" data-day="3">第 3 天</button>
      </div>
      <div class="toolbar-row">
        <div class="seg seg-sm" id="dirSeg" role="group" aria-label="练习方向">
          <button type="button" data-dir="en2cn" class="is-on">英 → 中</button>
          <button type="button" data-dir="cn2en">中 → 英</button>
        </div>
        <button type="button" class="chip" id="orderBtn" aria-pressed="false" title="切换顺序 / 乱序">顺序</button>
        <button type="button" class="chip" id="scopeBtn" aria-pressed="false" title="切换 全部 / 错词 / 收藏">全部词</button>
        <button type="button" class="chip" id="speakToggle" aria-pressed="true" title="显示卡片时自动朗读">发音 开</button>
      </div>
    </div>

    <div class="card-top">
      <span class="pos" id="posTag">v.</span>
      <div class="card-tools">
        <button type="button" class="mini-btn" id="speakBtn" aria-label="朗读这个单词" title="朗读">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
        </button>
        <button type="button" class="mini-btn" id="starBtn" aria-label="收藏这个单词" aria-pressed="false" title="收藏（S）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="star-path" d="m12 3.6 2.6 5.4 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.9l5.9-.9Z"/></svg>
        </button>
      </div>
    </div>

    <div class="card" id="card" role="button" tabindex="0" aria-label="点击翻面查看答案">
      <div class="card-inner" id="cardInner">
        <div class="face face-front">
          <div class="front-word" id="frontWord">achieve</div>
          <div class="flip-hint">点击 / 空格 翻面</div>
        </div>
        <div class="face face-back">
          <div class="back-main" id="backMain">实现；达到</div>
          <div class="back-alt" id="backAlt" hidden></div>
          <div class="tip" id="tip" hidden></div>
          <div class="example" id="example" hidden>
            <p class="ex-text" id="exText"></p>
            <p class="ex-src" id="exSrc"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="rate" id="rate">
      <button type="button" class="rate-btn again" data-rate="again">
        <span>不认识</span><kbd>←</kbd>
      </button>
      <button type="button" class="rate-btn fuzzy" data-rate="fuzzy">
        <span>模糊</span><kbd>↓</kbd>
      </button>
      <button type="button" class="rate-btn know" data-rate="know">
        <span>认识</span><kbd>→</kbd>
      </button>
    </div>

    <p class="meta">
      <span id="counter">1 / 120</span>
      <span class="dot">·</span>
      <span id="stats">认识 0 · 模糊 0 · 不认识 0</span>
      <button type="button" class="link-btn" id="resetBtn">重置进度</button>
    </p>  </main>

  <section class="done" id="done" hidden aria-live="polite">
    <div class="done-inner">
      <div class="done-seal" aria-hidden="true">✓</div>
      <p class="done-kicker">本轮完成</p>
      <h2 id="doneTitle">40 个词过完了</h2>
      <p class="done-sub" id="doneSub"></p>
      <p class="done-stats" id="doneStats"></p>
      <div class="done-actions">
        <button type="button" class="btn-primary" id="againWrong">复习错词</button>
        <button type="button" class="btn-ghost" id="restart">再来一轮</button>
      </div>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-head">
      <h2 id="sheetTitle">全部单词 <span id="sheetCount"></span></h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="关闭词表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="sheet-hint">点任意单词跳到那张卡；圆点表示熟练度。</p>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <span class="legend"><i class="dot-know"></i>认识</span>
      <span class="legend"><i class="dot-fuzzy"></i>模糊</span>
      <span class="legend"><i class="dot-again"></i>不认识</span>
      <span class="legend"><i class="dot-new"></i>未学</span>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font:16px/1.7 system-ui;color:#211f1b">这个闪卡页面需要 JavaScript 才能翻面和记录进度，请开启后刷新。</p>
</noscript>

<script src="data/words.js"></script>
<script src="assets/tts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
